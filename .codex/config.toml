# Project-scoped GitHub MCP configuration. This is loaded only when this
# repository is trusted by Codex.
[mcp_servers.github_cartodex]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
http_headers = { "X-MCP-Tools" = "issue_read,issue_write,list_issues,search_issues,create_pull_request,update_pull_request" }
enabled_tools = ["issue_read", "issue_write", "list_issues", "search_issues", "create_pull_request", "update_pull_request"]
default_tools_approval_mode = "writes"
